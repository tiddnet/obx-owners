<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBX Owner Hub — Rental Intelligence for Outer Banks Owners</title>
  <meta name="description" content="See how your OBX rental property compares to the market. Free comp preview for every property in our index.">
  <link rel="canonical" href="https://owners.obx.deals/">

  <!-- Force HTTPS — Auth0 SPA SDK requires a secure origin -->
  <script>if (location.protocol === 'http:') location.replace('https:' + location.href.slice(5));</script>

  <!-- Auth0 SPA SDK -->
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --ink:    #1a1a1a;
      --muted:  #5a5a5a;
      --rule:   #e0e0e0;
      --accent: #1e6fa8;
      --accent2:#b04a2c;
      --bg:     #fafaf7;
      --card:   #ffffff;
      --tag-bg: #edf4fb;
      --tag-ink:#1e6fa8;
      --radius: 8px;
      --shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: var(--bg); color: var(--ink); line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ── */
    header { background: var(--card); border-bottom: 1px solid var(--rule);
             padding: 0 1.5rem; display: flex; align-items: center;
             justify-content: space-between; height: 52px; }
    .logo { font-weight: 700; font-size: 1rem; color: var(--ink); }
    .logo span { color: var(--accent); }
    .main { max-width: 860px; margin: 0 auto; padding: 2rem 1rem; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: .4rem;
           padding: .55rem 1.2rem; border-radius: var(--radius);
           font-size: .9rem; font-weight: 600; cursor: pointer;
           border: none; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-outline { background: transparent; border: 1.5px solid var(--accent);
                   color: var(--accent); }
    .btn-sm { padding: .35rem .85rem; font-size: .82rem; }
    .btn-upgrade { background: var(--accent2); color: #fff; }
    .link-btn { background: none; border: none; padding: 0; color: var(--accent); font-size: .82rem; cursor: pointer; text-decoration: underline; }
    .hamburger { background: none; border: 1px solid var(--rule); border-radius: var(--radius); padding: .3rem .55rem; font-size: 1rem; cursor: pointer; color: var(--ink); line-height: 1; }
    .hamburger:hover { background: var(--rule); }
    .menu-dropdown { position: absolute; top: calc(100% + .35rem); right: 0; background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 160px; z-index: 50; }
    .menu-item { display: block; width: 100%; text-align: left; background: none; border: none; padding: .65rem 1rem; font-size: .88rem; color: var(--ink); cursor: pointer; }
    .menu-item:hover { background: var(--bg); }
    .panel-modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .panel-box { background: var(--card); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 420px; position: relative; }

    /* ── Cards ── */
    .card { background: var(--card); border: 1px solid var(--rule);
            border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow); }

    /* ── Landing ── */
    .hero { text-align: center; padding: 3.5rem 1rem 2.5rem; }
    .hero h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); line-height: 1.2;
               margin-bottom: 1rem; }
    .hero p  { color: var(--muted); max-width: 540px; margin: 0 auto 2rem; font-size: 1.05rem; }
    .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
                    gap: 1rem; margin: 2rem 0; }
    .feature-card { background: var(--card); border: 1px solid var(--rule);
                    border-radius: var(--radius); padding: 1.25rem; }
    .feature-card h3 { font-size: .95rem; margin-bottom: .4rem; }
    .feature-card p  { font-size: .85rem; color: var(--muted); }
    .tier-tag { display: inline-block; padding: .15rem .5rem; border-radius: 4px;
                font-size: .72rem; font-weight: 700; margin-bottom: .5rem; }
    .tier-free { background: #e8f5e9; color: #2e7d32; }
    .tier-pro  { background: #fff3e0; color: #e65100; }

    /* ── Dashboard ── */
    .section-head { font-size: .75rem; font-weight: 700; color: var(--muted);
                    text-transform: uppercase; letter-spacing: .06em; margin-bottom: .75rem; }
    .prop-search { display: flex; gap: .5rem; margin-bottom: 1rem; }
    .prop-search input { flex: 1; border: 1px solid var(--rule); border-radius: var(--radius);
                         padding: .5rem .75rem; font-size: .9rem; }
    .prop-search input:focus { outline: 2px solid var(--accent); }
    .result-list { list-style: none; border: 1px solid var(--rule);
                   border-radius: var(--radius); overflow: hidden; background: var(--card); }
    .result-list li { padding: .65rem 1rem; border-bottom: 1px solid var(--rule);
                      cursor: pointer; font-size: .88rem; }
    .result-list li:last-child { border-bottom: none; }
    .result-list li:hover { background: var(--tag-bg); }
    .result-list li small { color: var(--muted); display: block; font-size: .77rem; }

    .prop-card { display: flex; justify-content: space-between; align-items: flex-start;
                 gap: 1rem; flex-wrap: wrap; }
    .prop-meta h2 { font-size: 1.1rem; margin-bottom: .25rem; }
    .prop-meta p  { font-size: .84rem; color: var(--muted); }
    .badge { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .6rem;
             border-radius: 20px; font-size: .76rem; font-weight: 600; }
    .badge-ocean    { background: #e3f2fd; color: #1565c0; }
    .badge-sound    { background: #e8eaf6; color: #3949ab; }
    .badge-interior { background: #f3e5f5; color: #6a1b9a; }

    /* ── Comp chart ── */
    .chart-wrap { position: relative; height: 240px; margin-top: 1rem; }
    .comp-weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr));
                  gap: .5rem; margin-top: 1rem; }
    .week-cell { background: var(--card); border: 1px solid var(--rule);
                 border-radius: 6px; padding: .6rem .75rem; font-size: .82rem; }
    .week-cell .date  { color: var(--muted); font-size: .72rem; }
    .week-cell .price { font-weight: 700; font-size: .95rem; }
    .week-cell.above  { border-left: 3px solid #ef5350; }
    .week-cell.at     { border-left: 3px solid #66bb6a; }
    .week-cell.below  { border-left: 3px solid #ffa726; }

    /* ── Upgrade gate ── */
    .gate { text-align: center; padding: 2rem; border: 2px dashed var(--rule);
            border-radius: var(--radius); color: var(--muted); }
    .gate h3 { color: var(--ink); font-size: 1rem; margin-bottom: .4rem; }
    .gate p  { font-size: .87rem; margin-bottom: 1rem; }

    /* ── Basis toggle ── */
    .basis-pills { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom .75rem; }
    .pill { padding: .25rem .7rem; border-radius: 20px; font-size: .78rem; font-weight: 600;
            cursor: pointer; border: 1.5px solid var(--rule); background: var(--card); color: var(--muted); }
    .pill.active { background: var(--tag-bg); color: var(--tag-ink); border-color: var(--accent); }

    /* ── Pace bar ── */
    .pace-bar { height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; margin-top: .35rem; }
    .pace-bar-fill { height: 100%; border-radius: 4px; background: var(--accent); }

    /* ── Misc ── */
    .spinner { border: 3px solid var(--rule); border-top-color: var(--accent);
               border-radius: 50%; width: 28px; height: 28px;
               animation: spin .7s linear infinite; margin: 2rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: #c62828; font-size: .85rem; padding: .5rem; }
    /* [x-cloak] removed — landing renders immediately, no full-page hide */
    .mt1 { margin-top: .75rem; }
    .mt2 { margin-top: 1.25rem; }
    .mb1 { margin-bottom: .75rem; }
  </style>
</head>
<body x-data="ownerHub()" x-init="init()">

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header>
  <a class="logo" href="/">OBX <span>Owner Hub</span></a>
  <div style="display:flex;align-items:center;gap:1rem">
    <template x-if="loading">
      <div class="spinner" style="width:20px;height:20px;margin:0"></div>
    </template>
    <template x-if="!loading && !user">
      <button class="btn btn-primary btn-sm" @click="login()">Sign in</button>
    </template>
    <template x-if="!loading && user">
      <div style="position:relative" @click.outside="menuOpen=false">
        <button class="hamburger" @click.stop="menuOpen=!menuOpen" aria-label="Menu">☰</button>
        <div class="menu-dropdown" x-show="menuOpen" @click.stop style="display:none">
          <div style="padding:.5rem 1rem .35rem;font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--rule)"
               x-text="user.email"></div>
          <button class="menu-item" @click="supportOpen=true;menuOpen=false">Contact &amp; feedback</button>
          <template x-if="tier !== 'free'">
            <button class="menu-item" @click="settingsOpen=true;menuOpen=false">Settings</button>
          </template>
          <div style="border-top:1px solid var(--rule);margin-top:.25rem">
            <button class="menu-item" @click="logout()">Sign out</button>
          </div>
        </div>
      </div>
    </template>
  </div>
</header>

<!-- ── Landing (always visible — static content, no auth gate) ────────────── -->
<template x-if="!user">
  <div class="main">
    <div class="hero">
      <h1>Know where your OBX rental <em>actually</em> stands</h1>
      <p>Compare your property to 9,000+ Outer Banks rentals. See the market p50 for free. Unlock full percentile breakdowns, booking pace, and weekly rate status with Pro.</p>
      <button class="btn btn-primary" @click="login()" :disabled="loading || !authClient">
        Get started — it's free
      </button>
    </div>

    <div class="feature-grid">
      <div class="feature-card">
        <span class="tier-tag tier-free">Free</span>
        <h3>Market comp preview</h3>
        <p>See the median weekly rate for your community, bedroom count, and view type — every week of the season.</p>
      </div>
      <div class="feature-card">
        <span class="tier-tag tier-pro">Pro</span>
        <h3>Full percentile breakdown</h3>
        <p>p25 / p50 / p75 / p90 — know exactly where you sit in the market, not just the midpoint.</p>
      </div>
      <div class="feature-card">
        <span class="tier-tag tier-pro">Pro</span>
        <h3>Booking pace signal</h3>
        <p>What % of your comp set is already booked week-by-week. The clearest signal for when to hold and when to cut.</p>
      </div>
      <div class="feature-card">
        <span class="tier-tag tier-pro">Pro</span>
        <h3>Rate basis transparency</h3>
        <p>Not all OBX rates are comparable. We separate base rent, rent+fees, and fee-inclusive rates so your comps are apples-to-apples.</p>
      </div>
    </div>

    <div style="text-align:center;margin-top:2rem">
      <p style="font-size:.84rem;color:var(--muted)">Data from Hatteras Realty, Outer Banks Blue, SOS, Twiddy, Village Realty, KEES, and 18 more OBX property managers.</p>
    </div>
  </div>
</template>

<!-- ── Dashboard (authenticated) ──────────────────────────────────────────── -->
<template x-if="user">
  <div class="main">

    <!-- Property picker -->
    <template x-if="!property">
      <div>
        <p class="section-head">Find your property</p>
        <div class="prop-search">
          <input type="text" placeholder="Search by property name or ID…"
                 x-model="searchQ"
                 @input.debounce.400ms="searchProps()"
                 @keydown.escape="searchResults=[]">
          <button class="btn btn-primary btn-sm" @click="searchProps()">Search</button>
        </div>
        <div x-show="searchError" class="error-msg" x-text="searchError"></div>
        <div x-show="searchLoading"><div class="spinner" style="width:20px;height:20px;margin:1rem 0"></div></div>
        <ul class="result-list" x-show="searchResults.length">
          <template x-for="r in searchResults" :key="r.property_id">
            <li @click="selectProperty(r)">
              <span x-text="r.property_name || r.property_id"></span>
              <small x-text="[r.community, r.pmc, r.bedrooms ? r.bedrooms+'BR' : ''].filter(Boolean).join(' · ')"></small>
            </li>
          </template>
        </ul>
        <!-- Not in index — ingestion request form -->
        <div x-show="searchResults.length===0 && searchQ.length>1 && !searchLoading"
             style="margin-top:1rem">
          <p style="font-size:.84rem;color:var(--muted);margin-bottom:.75rem">
            Not finding your property? We index 9,000+ OBX rentals — if yours isn't here yet, tell us about it and we'll add it.
          </p>
          <template x-if="!ingestionSubmitted">
            <div class="card" x-data>
              <p class="section-head">Request property ingestion</p>
              <div style="display:grid;gap:.65rem">
                <div>
                  <label style="font-size:.82rem;font-weight:600;display:block;margin-bottom:.25rem">Contact email <span style="color:#c62828">*</span></label>
                  <input type="email" x-model="ingestionForm.contact_email"
                         style="width:100%;border:1px solid var(--rule);border-radius:var(--radius);padding:.45rem .7rem;font-size:.88rem"
                         placeholder="your@email.com">
                </div>
                <div>
                  <label style="font-size:.82rem;font-weight:600;display:block;margin-bottom:.25rem">Property URL(s) <span style="color:#c62828">*</span></label>
                  <textarea x-model="ingestionForm.urls_raw" rows="3"
                            style="width:100%;border:1px solid var(--rule);border-radius:var(--radius);padding:.45rem .7rem;font-size:.88rem;resize:vertical"
                            placeholder="https://www.hatterasrealty.com/...&#10;https://www.airbnb.com/rooms/...&#10;One URL per line. Include any platform you're listed on."></textarea>
                </div>
                <div>
                  <label style="font-size:.82rem;font-weight:600;display:block;margin-bottom:.25rem">Tell us about your property</label>
                  <textarea x-model="ingestionForm.description" rows="2"
                            style="width:100%;border:1px solid var(--rule);border-radius:var(--radius);padding:.45rem .7rem;font-size:.88rem;resize:vertical"
                            placeholder="Bedrooms, view type, community, anything helpful for getting the data right."></textarea>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:.65rem">
                  <div>
                    <label style="font-size:.82rem;font-weight:600;display:block;margin-bottom:.25rem">Favorite feature of your property</label>
                    <input type="text" x-model="ingestionForm.favorite_feature"
                           style="width:100%;border:1px solid var(--rule);border-radius:var(--radius);padding:.45rem .7rem;font-size:.88rem"
                           placeholder="Hot tub on the top deck…">
                  </div>
                  <div>
                    <label style="font-size:.82rem;font-weight:600;display:block;margin-bottom:.25rem">Favorite local spot</label>
                    <input type="text" x-model="ingestionForm.favorite_place"
                           style="width:100%;border:1px solid var(--rule);border-radius:var(--radius);padding:.45rem .7rem;font-size:.88rem"
                           placeholder="Buxton Woods, Frisco pier…">
                  </div>
                </div>
                <div x-show="ingestionError" class="error-msg" x-text="ingestionError"></div>
                <button class="btn btn-primary" style="align-self:flex-start"
                        :disabled="ingestionLoading"
                        @click="submitIngestionRequest()">
                  <span x-show="!ingestionLoading">Submit request</span>
                  <span x-show="ingestionLoading">Submitting…</span>
                </button>
              </div>
            </div>
          </template>
          <template x-if="ingestionSubmitted">
            <div class="card" style="text-align:center;color:var(--muted)">
              <p style="font-size:1.1rem;margin-bottom:.4rem">✓ Request received</p>
              <p style="font-size:.87rem">We'll add your property to the index and reach out if we have questions. Usually within a few days.</p>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Property dashboard -->
    <template x-if="property">
      <div>
        <!-- Property header -->
        <div class="card mb1">
          <div class="prop-card">
            <div class="prop-meta">
              <h2 x-text="property.property_name || property.property_id"></h2>
              <p x-text="[property.community, property.pmc].filter(Boolean).join(' · ')"></p>
              <p style="margin-top:.25rem">
                <span x-text="(property.canonical_bedrooms || property.bedrooms || '?') + ' BR'"></span>
                &nbsp;·&nbsp;
                <span :class="'badge badge-'+property.view_tier"
                      x-text="property.view_tier || 'interior'"></span>
                <template x-if="property.has_pool"><span style="margin-left:.4rem;font-size:.8rem">🏊 pool</span></template>
                <template x-if="property.has_hot_tub"><span style="margin-left:.4rem;font-size:.8rem">♨️ hot tub</span></template>
              </p>
            </div>
            <div>
              <button class="btn btn-outline btn-sm" @click="clearProperty()">Change property</button>
            </div>
          </div>
        </div>

        <!-- Rate basis pills (if multiple bases in comp data) -->
        <template x-if="availableBases.length > 1">
          <div class="mb1">
            <p class="section-head">Comp rate basis</p>
            <div class="basis-pills">
              <template x-for="b in availableBases" :key="b">
                <button class="pill" :class="{active: activeBases.includes(b)}"
                        @click="toggleBasis(b)" x-text="b"></button>
              </template>
            </div>
            <p style="font-size:.77rem;color:var(--muted)">Rates across OBX use different bases (base rent, rent+fees, fee-inclusive). Toggle to compare like-for-like.</p>
          <template x-if="ownRateBasis">
            <p style="font-size:.77rem;color:var(--muted);margin-top:.3rem">
              Your listed rate basis: <strong x-text="ownRateBasis"></strong>. For best comparison, enable only comps with the same basis.
            </p>
          </template>
          </div>
        </template>

        <!-- Comp chart -->
        <div class="card mb1">
          <p class="section-head">Market rate comps — <span x-text="property.community"></span>,
            <span x-text="property.canonical_bedrooms || property.bedrooms"></span>BR,
            <span x-text="property.view_tier"></span></p>

          <div x-show="compsLoading"><div class="spinner"></div></div>
          <div x-show="compsError" class="error-msg" x-text="compsError"></div>

          <div x-show="!compsLoading && compsData">
              <!-- Window toggle -->
              <div style="display:flex;gap:.4rem;margin-bottom:.6rem">
                <button class="pill" :class="{active: rateWindow==='8week'}"
                        @click="setRateWindow('8week')">Next 8 weeks</button>
                <button class="pill" :class="{active: rateWindow==='peak'}"
                        @click="setRateWindow('peak')">Peak (Jun–Aug)</button>
                <button class="pill" :class="{active: rateWindow==='full'}"
                        @click="setRateWindow('full')">Full season</button>
              </div>
              <div class="chart-wrap">
                <canvas id="compsChart"></canvas>
              </div>

              <!-- Free tier gate for full percentiles -->
              <template x-if="tier === 'free'">
                <div class="gate mt2">
                  <h3>Full percentile breakdown</h3>
                  <p>See p25/p50/p75/p90 to know exactly where your rate sits — not just the midpoint.</p>
                  <button class="btn btn-upgrade btn-sm" @click="showUpgrade()">Unlock with Pro →</button>
                </div>
              </template>

              <!-- Paid: rate summary bar -->
              <template x-if="tier !== 'free' && rateSummary && (rateSummary.above + rateSummary.at + rateSummary.below) > 0">
                <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;margin-bottom:.25rem;align-items:center">
                  <span style="font-size:.78rem;color:var(--muted);font-weight:600">Your rate position:</span>
                  <template x-if="rateSummary.above > 0">
                    <span style="font-size:.78rem;background:#fdecea;color:#c62828;padding:.2rem .55rem;border-radius:20px;font-weight:600"
                          x-text="rateSummary.above + ' week'+(rateSummary.above>1?'s':'')+' above p75'"></span>
                  </template>
                  <template x-if="rateSummary.at > 0">
                    <span style="font-size:.78rem;background:#e8f5e9;color:#2e7d32;padding:.2rem .55rem;border-radius:20px;font-weight:600"
                          x-text="rateSummary.at + ' week'+(rateSummary.at>1?'s':'')+' at market'"></span>
                  </template>
                  <template x-if="rateSummary.below > 0">
                    <span style="font-size:.78rem;background:#fff8e1;color:#e65100;padding:.2rem .55rem;border-radius:20px;font-weight:600"
                          x-text="rateSummary.below + ' week'+(rateSummary.below>1?'s':'')+' below p25'"></span>
                  </template>
                </div>
              </template>

              <!-- Paid: weekly breakdown cells -->
              <template x-if="tier !== 'free'">
                <div class="comp-weeks mt1">
                  <template x-for="w in filteredWeeks" :key="w.week_of">
                    <div class="week-cell"
                         :class="{
                           'above': ratePosition(w) === 'above_p75',
                           'at':    ratePosition(w) === 'p50_to_p75' || ratePosition(w) === 'p25_to_p50',
                           'below': ratePosition(w) === 'below_p25'
                         }">
                      <div class="date" x-text="fmtWeek(w.week_of)"></div>
                      <template x-if="activeBasesData(w)">
                        <div>
                          <div class="price" x-text="'$'+Math.round(activeBasesData(w).p50).toLocaleString()"></div>
                          <div style="font-size:.72rem;color:var(--muted)"
                               x-text="'p25 $'+Math.round(activeBasesData(w).p25||0).toLocaleString()+
                                       ' · p75 $'+Math.round(activeBasesData(w).p75||0).toLocaleString()"></div>
                          <template x-if="ownOpen[w.week_of]">
                            <div style="font-size:.78rem;font-weight:700;margin-top:.2rem"
                                 :style="ratePosition(w)==='above_p75' ? 'color:#c62828' :
                                         ratePosition(w)==='below_p25' ? 'color:#e65100' : 'color:#2e7d32'"
                                 x-text="'Open: $'+Math.round(ownOpen[w.week_of]).toLocaleString()"></div>
                          </template>
                          <template x-if="ownBooked[w.week_of]">
                            <div style="font-size:.78rem;font-weight:700;margin-top:.1rem;color:#2d7a3a"
                                 x-text="'Booked: $'+Math.round(ownBooked[w.week_of]).toLocaleString()"></div>
                          </template>

<script>
const AUTH0_DOMAIN   = 'dev-4fg3icvrjdrj4o4a.us.auth0.com';
const AUTH0_CLIENT   = 'OQKSijQtrT6jcqIDIPNbbzzACig8TdXE';
const AUTH0_AUDIENCE = 'https://owners-api.obx.deals';
const API_BASE       = 'https://owners-api.obx.deals';

function ownerHub() {
  return {
    // Auth state
    authClient: null,
    user:    null,
    token:   null,
    loading: true,

    // User record
    tier:     'free',
    features: {},

    // Property
    property:      null,
    searchQ:       '',
    searchResults: [],
    searchLoading: false,
    searchError:   '',

    // Comps
    compsData:   null,
    compsLoading: false,
    compsError:  '',
    activeBases: [],

    // Pace
    paceData:    null,
    paceLoading: false,
    paceError:   '',

    // Own rates (paid — open weeks from weekly_rates, booked from inferred_bookings)
    ownOpen:      {},   // { week_of: rate } — orange: currently listed/available
    ownBooked:    {},   // { week_of: rate } — green: inferred booking clearance
    ownRateBasis: null,
    rateWindow:   '8week', // '8week' | 'peak' | 'full'

    // UI
    upgradeVisible: false,
    upgradeInterestLoading: false,
    upgradeInterestFlagged: false,
    checkoutLoading: false,
    paymentSuccess: false,
    // Gaps + report
    gapSummary:   null,
    gapData:      null,
    gapLoading:   false,
    reportLoading: false,
    reportError:   '',

    // Briefing settings
    briefingEnabled: false,
    briefingLoading: false,
    briefingSaved:   false,

    // Support form
    supportSubject:   '',
    supportMessage:   '',
    supportLoading:   false,
    supportSubmitted: false,
    supportError:     '',
    supportOpen:      false,
    settingsOpen:     false,
    menuOpen:         false,

    // Ingestion request form
    ingestionForm: { contact_email: '', urls_raw: '', description: '', favorite_feature: '', favorite_place: '' },
    ingestionLoading: false,
    ingestionError: '',
    ingestionSubmitted: false,

    // ── Init ─────────────────────────────────────────────────────────────────
    async init() {
      try {
        this.authClient = await auth0.createAuth0Client({
          domain:        AUTH0_DOMAIN,
          clientId:      AUTH0_CLIENT,
          authorizationParams: { audience: AUTH0_AUDIENCE, scope: 'openid profile email' },
          cacheLocation: 'memory',
        });

        // Handle redirect callback (code exchange after Auth0 login)
        if (location.search.includes('code=') || location.search.includes('error=')) {
          try {
            await this.authClient.handleRedirectCallback();
          } catch (e) {
            console.warn('Redirect callback error:', e);
          }
          history.replaceState({}, document.title, location.pathname);
        }

        // Handle Stripe Checkout success redirect — re-fetch /me so tier shows as pro
        if (new URLSearchParams(location.search).get('payment') === 'success') {
          this.paymentSuccess = true;
          history.replaceState({}, document.title, location.pathname);
          // loadMe() runs below after isAuthenticated check; tier will reflect pro
        }

        const isAuthenticated = await this.authClient.isAuthenticated();
        if (isAuthenticated) {
          this.token = await this.authClient.getTokenSilently();
          const profile = await this.authClient.getUser();
          this.user = profile;
          this.ingestionForm.contact_email = profile.email || '';
          await this.loadMe();
        }
      } catch (e) {
        console.error('Auth0 init error:', e);
      } finally {
        this.loading = false;
      }
    },

    async login() {
      if (!this.authClient) { console.warn('Auth0 not ready yet'); return; }
      // Clear any stale PKCE state from previous attempts before starting a new flow
      Object.keys(sessionStorage)
        .filter(k => k.startsWith('a0.'))
        .forEach(k => sessionStorage.removeItem(k));
      await this.authClient.loginWithRedirect({
        authorizationParams: { redirect_uri: location.origin + location.pathname },
      });
    },

    async logout() {
      await this.authClient.logout({ logoutParams: { returnTo: location.origin } });
      this.user = null; this.token = null; this.property = null;
    },

    // ── API ───────────────────────────────────────────────────────────────────
    async api(path, opts={}) {
      if (!this.token) this.token = await this.authClient.getTokenSilently();
      const res = await fetch(API_BASE + path, {
        ...opts,
        headers: { Authorization: 'Bearer ' + this.token, 'Content-Type': 'application/json', ...(opts.headers||{}) },
      });
      if (res.status === 401) { this.token = null; await this.login(); return null; }
      return res;
    },

    // ── User record ──────────────────────────────────────────────────────────
    async loadMe() {
      const res = await this.api('/me');
      if (!res || !res.ok) return;
      const data = await res.json();
      this.tier            = data.tier || 'free';
      this.features        = data.features || {};
      this.briefingEnabled = !!data.briefing_enabled;
      if (data.property_id) await this.loadProperty(data.property_id);
    },

    async toggleBriefing(enabled) {
      this.briefingEnabled = enabled;
      this.briefingLoading = true;
      this.briefingSaved   = false;
      await this.api('/me/briefing', {
        method: 'POST',
        body: JSON.stringify({ enabled }),
      });
      this.briefingLoading = false;
      this.briefingSaved   = true;
      setTimeout(() => { this.briefingSaved = false; }, 2500);
    },

    // ── Property search ───────────────────────────────────────────────────────
    async searchProps() {
      const q = this.searchQ.trim();
      if (q.length < 2) { this.searchResults = []; return; }
      this.searchLoading = true; this.searchError = '';
      const res = await this.api('/property/search?q=' + encodeURIComponent(q));
      this.searchLoading = false;
      if (!res) return;
      if (!res.ok) { this.searchError = 'Search failed. Try again.'; return; }
      this.searchResults = await res.json();
    },

    async selectProperty(r) {
      this.searchResults = [];
      await this.loadProperty(r.property_id);
      // Save to user record; include email + first_name so briefing emailer has them
      await this.api('/me/property', {
        method: 'POST',
        body: JSON.stringify({
          property_id: r.property_id,
          email:       this.user?.email || '',
          first_name:  this.user?.given_name || this.user?.name?.split(' ')[0] || '',
        }),
      });
    },

    async loadProperty(id) {
      const res = await this.api('/property/' + encodeURIComponent(id));
      if (!res || !res.ok) return;
      const prop = await res.json();
      // Derive view_tier if not set
      prop.view_tier = this._viewTier(prop.view_type);
      this.property = prop;
      await this.loadComps();
      if (this.tier !== 'free') {
        await Promise.all([this.loadPace(), this.loadRates(), this.loadGaps()]);
      } else {
        this.loadGapSummary();
      }
      this.$nextTick(() => this.drawChart());
    },

    clearProperty() {
      this.property = null; this.compsData = null; this.paceData = null;
      this.ownOpen = {}; this.ownBooked = {}; this.ownRateBasis = null;
      this.gapSummary = null; this.gapData = null; this.reportError = '';
      this.searchQ = ''; this.searchResults = [];
      this.ingestionSubmitted = false; this.ingestionError = '';
      this.ingestionForm.urls_raw = ''; this.ingestionForm.description = '';
      this.ingestionForm.favorite_feature = ''; this.ingestionForm.favorite_place = '';
      const oldCtx = document.getElementById('compsChart');
      if (oldCtx?._chart) { oldCtx._chart.destroy(); delete oldCtx._chart; }
    },

    // ── Comps ─────────────────────────────────────────────────────────────────
    async loadComps() {
      this.compsLoading = true; this.compsError = ''; this.compsData = null;
      const id = this.property.property_id;
      const res = await this.api('/property/' + encodeURIComponent(id) + '/comps');
      this.compsLoading = false;
      if (!res || !res.ok) { this.compsError = 'Could not load comp data.'; return; }
      const data = await res.json();
      this.compsData = data;

      // Collect all rate_basis values across all weeks
      const bases = new Set();
      (data.weeks || []).forEach(w => Object.keys(w.by_basis || {}).forEach(b => bases.add(b)));
      this.availableBases = [...bases].sort();
      this.activeBases = [...this.availableBases]; // default all on
    },

    get filteredWeeks() {
      const all = (this.compsData?.weeks || []).filter(w =>
        this.activeBases.some(b => w.by_basis && w.by_basis[b])
      );
      if (this.rateWindow === 'full') return all;
      if (this.rateWindow === 'peak') {
        return all.filter(w => { const m = parseInt(w.week_of.slice(5,7),10); return m >= 6 && m <= 8; });
      }
      // 8week: rolling 8 weeks from today
      const today = new Date(); today.setHours(0,0,0,0);
      const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() + 56);
      return all.filter(w => { const d = new Date(w.week_of + 'T00:00:00'); return d >= today && d <= cutoff; });
    },

    get availableBases() {
      return this._availableBases || [];
    },
    set availableBases(v) { this._availableBases = v; },

    activeBasesData(week) {
      // Return merged data across active bases (average of p50s for simplicity)
      const entries = this.activeBases.map(b => week.by_basis?.[b]).filter(Boolean);
      if (!entries.length) return null;
      const avg = (key) => entries.reduce((s,e) => s + (e[key]||0), 0) / entries.length;
      return { p25: avg('p25'), p50: avg('p50'), p75: avg('p75'), p90: avg('p90'),
               n: entries.reduce((s,e) => s + (e.n||0), 0) };
    },

    setRateWindow(w) {
      this.rateWindow = w;
      this.$nextTick(() => this.drawChart());
    },

    toggleBasis(b) {
      if (this.activeBases.includes(b)) {
        if (this.activeBases.length === 1) return; // keep at least one
        this.activeBases = this.activeBases.filter(x => x !== b);
      } else {
        this.activeBases = [...this.activeBases, b];
      }
      this.$nextTick(() => this.drawChart());
    },

    drawChart() {
      const weeks = this.filteredWeeks.slice(0, 26);
      if (!weeks.length) return;
      const ctx = document.getElementById('compsChart');
      if (!ctx) return;

      const labels  = weeks.map(w => this.fmtWeek(w.week_of));
      const p50s    = weeks.map(w => { const d = this.activeBasesData(w); return d ? Math.round(d.p50) : null; });
      const p25s    = weeks.map(w => { const d = this.activeBasesData(w); return d ? Math.round(d.p25) : null; });
      const p75s    = weeks.map(w => { const d = this.activeBasesData(w); return d ? Math.round(d.p75) : null; });
      const free    = this.tier === 'free';
      // Open weeks: orange dots (what you're asking); booked weeks: green dots (what cleared)
      const openPts   = weeks.map(w => this.ownOpen[w.week_of]   ? Math.round(this.ownOpen[w.week_of])   : null);
      const bookedPts = weeks.map(w => this.ownBooked[w.week_of] ? Math.round(this.ownBooked[w.week_of]) : null);
      const hasOpen   = openPts.some(v => v != null);
      const hasBooked = bookedPts.some(v => v != null);

      const _scatter = (label, data, color) => ({
        label, data, type: 'line',
        borderColor: 'transparent', backgroundColor: color,
        pointBackgroundColor: color, pointBorderColor: '#fff', pointBorderWidth: 1.5,
        pointRadius: 5, pointHoverRadius: 7,
        showLine: false, order: 0,
      });

      const datasets = [
        ...(!free ? [
          { label: 'p25', data: p25s, backgroundColor: 'rgba(30,111,168,.18)', borderRadius: 3 },
          { label: 'p75', data: p75s, backgroundColor: 'rgba(30,111,168,.38)', borderRadius: 3 },
        ] : []),
        { label: 'Market p50', data: p50s, backgroundColor: 'rgba(30,111,168,.72)', borderRadius: 3 },
        ...(hasOpen   ? [_scatter('Your rate (open)',   openPts,   '#b04a2c')] : []),
        ...(hasBooked ? [_scatter('Your rate (booked)', bookedPts, '#2d7a3a')] : []),
      ];

      if (ctx._chart) {
        // Update in-place — avoids Chart.js canvas reuse errors (ADR 0124)
        // Stored on the canvas element (not Alpine reactive data) so Alpine's
        // proxy doesn't wrap the Chart.js instance and break chart.update().
        ctx._chart.data.labels   = labels;
        ctx._chart.data.datasets = datasets;
        ctx._chart.update('none');
        return;
      }

      ctx._chart = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: !free || hasOpen || hasBooked } },
          scales: {
            y: { ticks: { callback: v => '$' + (v/1000).toFixed(0) + 'k' } },
            x: { ticks: { maxRotation: 45, font: { size: 10 } } },
          },
        },
      });
    },

    // ── Own rates (paid) ──────────────────────────────────────────────────────
    async loadRates() {
      this.ownOpen = {}; this.ownBooked = {};
      const id  = this.property.property_id;
      const res = await this.api('/property/' + encodeURIComponent(id) + '/rates');
      if (!res || !res.ok) return;
      const rows = await res.json();
      const open = {}, booked = {};
      rows.forEach(r => {
        if (r.status === 'booked') booked[r.week_of] = r.rate;
        else                       open[r.week_of]   = r.rate;
      });
      this.ownOpen      = open;
      this.ownBooked    = booked;
      this.ownRateBasis = rows.find(r => r.rate_basis)?.rate_basis || null;
    },

    // Position of own rate vs comp bucket for a given week
    // Returns: 'above_p75' | 'p50_to_p75' | 'p25_to_p50' | 'below_p25' | null
    ratePosition(week) {
      const own = this.ownOpen[week.week_of];
      if (own == null) return null;
      const d = this.activeBasesData(week);
      if (!d) return null;
      if (own > d.p75)  return 'above_p75';
      if (own > d.p50)  return 'p50_to_p75';
      if (own > d.p25)  return 'p25_to_p50';
      return 'below_p25';
    },

    get rateSummary() {
      if (!this.compsData || !Object.keys(this.ownOpen).length) return null;
      let above = 0, at = 0, below = 0, noData = 0;
      this.filteredWeeks.slice(0, 26).forEach(w => {
        const pos = this.ratePosition(w);
        if (!pos) { noData++; return; }
        if (pos === 'above_p75')  above++;
        else if (pos === 'below_p25') below++;
        else at++;
      });
      return { above, at, below, noData };
    },

    // ── Booking pace ──────────────────────────────────────────────────────────
    async loadPace() {
      this.paceLoading = true; this.paceError = ''; this.paceData = null;
      const id = this.property.property_id;
      const res = await this.api('/property/' + encodeURIComponent(id) + '/pace');
      this.paceLoading = false;
      if (!res || !res.ok) { this.paceError = 'Could not load pace data.'; return; }
      this.paceData = await res.json();
    },

    // ── Gaps + report ─────────────────────────────────────────────────────────
    async loadGapSummary() {
      if (!this.property) return;
      const id = this.property.property_id;
      const res = await this.api('/property/' + encodeURIComponent(id) + '/gaps');
      if (res && res.ok) this.gapSummary = await res.json();
    },

    async loadGaps() {
      if (!this.property) return;
      this.gapLoading = true;
      const id = this.property.property_id;
      const res = await this.api('/property/' + encodeURIComponent(id) + '/gaps');
      this.gapLoading = false;
      if (res && res.ok) this.gapData = await res.json();
    },

    async downloadReport() {
      this.reportError = ''; this.reportLoading = true;
      const id = this.property.property_id;
      const res = await this.api('/property/' + encodeURIComponent(id) + '/report');
      this.reportLoading = false;
      if (!res || !res.ok) { this.reportError = 'Could not generate report. Please try again.'; return; }
      const { pdf_b64 } = await res.json();
      const bytes = Uint8Array.from(atob(pdf_b64), c => c.charCodeAt(0));
      const blob  = new Blob([bytes], { type: 'application/pdf' });
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement('a');
      a.href      = url;
      a.download  = (this.property.property_name || id).replace(/[^a-z0-9]/gi, '_') + '_report.pdf';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    },

    // ── Upgrade ───────────────────────────────────────────────────────────────
    showUpgrade() { this.upgradeVisible = true; },

    async startCheckout() {
      this.checkoutLoading = true;
      try {
        const res = await this.api('/subscribe', { method: 'POST', body: '{}' });
        if (!res || !res.ok) {
          alert('Unable to start checkout. Please try again.');
          this.checkoutLoading = false;
          return;
        }
        const data = await res.json();
        window.location.href = data.checkout_url;
      } catch (e) {
        console.error('Checkout error:', e);
        alert('Unable to start checkout. Please try again.');
        this.checkoutLoading = false;
      }
    },

    async flagUpgradeInterest() {
      this.upgradeInterestLoading = true;
      const res = await this.api('/me/upgrade-interest', { method: 'POST', body: '{}' });
      this.upgradeInterestLoading = false;
      if (res && res.ok) this.upgradeInterestFlagged = true;
    },

    // ── Ingestion request ─────────────────────────────────────────────────────
    async submitIngestionRequest() {
      this.ingestionError = '';
      const email = this.ingestionForm.contact_email.trim();
      const urls  = this.ingestionForm.urls_raw.split('\n').map(u => u.trim()).filter(Boolean);
      if (!email) { this.ingestionError = 'Contact email is required.'; return; }
      if (!urls.length) { this.ingestionError = 'At least one URL is required.'; return; }

      this.ingestionLoading = true;
      const res = await this.api('/me/ingestion-request', {
        method: 'POST',
        body: JSON.stringify({
          contact_email:    email,
          urls,
          description:      this.ingestionForm.description.trim() || undefined,
          favorite_feature: this.ingestionForm.favorite_feature.trim() || undefined,
          favorite_place:   this.ingestionForm.favorite_place.trim() || undefined,
        }),
      });
      this.ingestionLoading = false;
      if (res && res.ok) {
        this.ingestionSubmitted = true;
      } else {
        this.ingestionError = 'Something went wrong. Please try again.';
      }
    },

    // ── Support request ───────────────────────────────────────────────────────
    async submitSupport() {
      this.supportError = '';
      if (!this.supportSubject) { this.supportError = 'Please select a subject.'; return; }
      if (this.supportMessage.trim().length < 10) { this.supportError = 'Please provide a bit more detail.'; return; }
      this.supportLoading = true;
      const res = await this.api('/support', {
        method: 'POST',
        body: JSON.stringify({ subject: this.supportSubject, message: this.supportMessage.trim() }),
      });
      this.supportLoading = false;
      if (res && res.ok) {
        this.supportSubmitted = true;
      } else {
        this.supportError = 'Something went wrong. Please try again.';
      }
    },

    // ── Helpers ───────────────────────────────────────────────────────────────
    fmtWeek(iso) {
      if (!iso) return '';
      const d = new Date(iso + 'T12:00:00Z');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
    },

    _viewTier(view_type) {
      const vt = (view_type || '').toLowerCase().trim();
      if (vt === 'oceanfront') return 'oceanfront';
      if (['oceanside','ocean_side','ocean_view','semi_oceanfront','semi-oceanfront','semi oceanfront'].includes(vt)) return 'oceanside';
      if (['soundfront','soundside','sound_view','sound front','sound side'].includes(vt)) return 'sound';
      return 'interior';
    },
  };
}
</script>
